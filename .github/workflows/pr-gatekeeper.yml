name: PR Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, development]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gatekeeper:
    if: >-
      github.event_name == 'pull_request' ||
      contains(fromJSON('["main", "development"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run lint checks
        id: lint
        continue-on-error: true
        run: |
          npm run format
          npm run lint

      - name: Evaluate PR readiness
        uses: actions/github-script@v7
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request.number;
            const REQUIRED_APPROVALS = 2;
            const LABEL = 'do-not-merge';

            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL,
                color: 'd73a4a',
                description: 'Blocked: failing lint or missing required approvals',
              });
            } catch (e) {
              // label already exists
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr_number,
            });
            const latestByUser = {};
            for (const r of reviews) {
              if (r.user && r.state !== 'COMMENTED') {
                latestByUser[r.user.login] = r.state;
              }
            }
            const approvals = Object.values(latestByUser).filter(s => s === 'APPROVED').length;

            const lintPassed = process.env.LINT_OUTCOME === 'success';

            const reasons = [];
            if (!lintPassed) {
              reasons.push('- ❌ Lint check (prettier / eslint) is failing.');
            }
            if (approvals < REQUIRED_APPROVALS) {
              reasons.push(`- ❌ Needs ${REQUIRED_APPROVALS - approvals} more approving review(s) (currently ${approvals}/${REQUIRED_APPROVALS}).`);
            }

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: pr_number,
            });
            const hasLabel = labels.some(l => l.name === LABEL);

            let body;
            if (reasons.length > 0) {
              if (!hasLabel) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr_number, labels: [LABEL] });
              }
              body = `### PR Gatekeeper\n\nThis PR is **not ready to merge**:\n\n${reasons.join('\n')}\n\nThis updates automatically once fixed.`;
            } else {
              if (hasLabel) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr_number, name: LABEL });
              }
              body = '### PR Gatekeeper\n\nAll checks passed: lint is clean and required approvals received. Ready to merge.';
            }

            const marker = '<!-- pr-gatekeeper -->';
            const fullBody = `${marker}\n${body}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fullBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr_number, body: fullBody });
            }
