<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>KmerCargo Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .safety-gradient {
            background: linear-gradient(135deg, #ff9f1c 0%, #895100 100%);
        }
        .glass-panel {
            background: rgba(255, 248, 244, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(218, 194, 174, 0.3);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "surface-container-low": "#fff1e7",
                        "on-secondary-fixed": "#00164e",
                        "primary-fixed-dim": "#ffb86b",
                        "tertiary-fixed-dim": "#70d2ff",
                        "on-secondary-fixed-variant": "#264191",
                        "inverse-primary": "#ffb86b",
                        "surface-container": "#fcebdd",
                        "secondary-fixed-dim": "#b6c4ff",
                        "on-primary": "#ffffff",
                        "secondary": "#4059aa",
                        "inverse-on-surface": "#ffeee0",
                        "surface-dim": "#e8d7ca",
                        "text-primary-light": "#0F172A",
                        "surface-bright": "#fff8f4",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#dce1ff",
                        "border-dark": "#334155",
                        "on-primary-container": "#683c00",
                        "success-momo": "#10B981",
                        "outline-variant": "#dac2ae",
                        "surface-container-high": "#f6e5d7",
                        "primary-fixed": "#ffdcbc",
                        "text-primary-dark": "#F8FAFC",
                        "on-primary-fixed": "#2c1700",
                        "bg-light": "#F8FAFC",
                        "on-primary-fixed-variant": "#683d00",
                        "surface-tint": "#895100",
                        "tertiary-fixed": "#c0e8ff",
                        "surface": "#fff8f4",
                        "tertiary": "#006686",
                        "background": "#fff8f4",
                        "surface-container-highest": "#f0e0d2",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#004d66",
                        "on-background": "#221a12",
                        "inverse-surface": "#382f25",
                        "secondary-container": "#8fa7fe",
                        "border-light": "#E2E8F0",
                        "on-tertiary-fixed-variant": "#004d66",
                        "on-secondary-container": "#1d3989",
                        "bg-dark": "#0F172A",
                        "surface-variant": "#f0e0d2",
                        "on-tertiary": "#ffffff",
                        "primary": "#895100",
                        "text-secondary-dark": "#94A3B8",
                        "on-tertiary-fixed": "#001e2b",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#00c3fd",
                        "on-surface-variant": "#544434",
                        "on-surface": "#221a12",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#877462",
                        "primary-container": "#ff9f1c",
                        "error": "#ba1a1a",
                        "text-secondary-light": "#64748B"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "base": "8px",
                        "touch-target-min": "56px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "data-display": ["JetBrains Mono"],
                        "button": ["Inter"],
                        "body-md": ["Inter"],
                        "h1-mobile": ["Plus Jakarta Sans"],
                        "h2-mobile": ["Plus Jakarta Sans"],
                        "data-label": ["JetBrains Mono"],
                        "h1": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "data-display": ["16px", {"lineHeight": "24px", "letterSpacing": "-0.02em", "fontWeight": "500"}],
                        "button": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "h1-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "h2-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "data-label": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "h1": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "h2": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-gutter overflow-hidden relative">
<!-- Background Atmospheric Effect -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary-container/10 blur-[120px]"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-secondary-container/10 blur-[120px]"></div>
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#895100 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[480px]">
<div class="glass-panel p-margin-desktop rounded-xl shadow-2xl flex flex-col gap-8">
<!-- Branding & Header -->
<div class="flex flex-col items-center text-center gap-4">
<div class="w-20 h-20 bg-primary-container rounded-xl flex items-center justify-center shadow-lg transform rotate-3 hover:rotate-0 transition-transform duration-500">
<span class="material-symbols-outlined text-[48px] text-on-primary-container" data-icon="local_shipping">local_shipping</span>
</div>
<div>
<h1 class="font-h1 text-h1 text-on-background tracking-tight">KmerCargo</h1>
<h2 class="font-h2 text-h2 text-primary mt-1">Admin Portal</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Enter your credentials to manage the logistics fleet.</p>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-6" id="loginForm" onsubmit="return false;">
<!-- Input Group -->
<div class="flex flex-col gap-2">
<label class="font-data-label text-data-label text-on-surface-variant uppercase" for="admin_creds">Enter Admin Code or Password</label>
<div class="relative group"><input class="w-full h-touch-target-min px-4 bg-surface-container-lowest border-2 border-outline-variant rounded-lg font-data-display text-data-display text-on-surface focus:ring-0 focus:border-primary transition-all placeholder:text-outline" id="admin_creds" placeholder="••••••••" type="password"></div>
</div>
<!-- Primary Action -->
<button class="h-touch-target-min safety-gradient text-on-primary font-button text-button rounded-lg shadow-md hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="loginBtn" type="submit">
<span id="btnText">Sign In to Dashboard</span>
<span class="material-symbols-outlined animate-spin hidden" data-icon="progress_activity" id="loadingIcon">progress_activity</span>
<span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="flex flex-col items-center gap-4 border-t border-outline-variant pt-6">
<a class="font-button text-button text-secondary hover:text-on-secondary-container hover:underline transition-colors flex items-center gap-2 group" href="#">
                    Request Admin Access
                    <span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</a>
<p class="font-body-sm text-body-sm text-outline text-center px-4">
                    Strictly for authorized logistics personnel and fleet managers in Cameroon.
                </p>
</div>
</div>
<!-- Support Info -->
<div class="mt-8 flex justify-between items-center px-4">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-success-momo animate-pulse"></span>
<span class="font-data-label text-data-label text-on-surface-variant">System Online</span>
</div>
<div class="flex gap-4">
<span class="font-data-label text-data-label text-on-surface-variant opacity-60">v4.2.0</span>
<span class="font-data-label text-data-label text-on-surface-variant opacity-60">Yaoundé HQ</span>
</div>
</div>
</main>
<!-- Side Decoration (Desktop Only) -->
<div class="hidden lg:block absolute right-12 bottom-12 w-64 h-64 opacity-10">
<span class="material-symbols-outlined text-[256px] text-primary" data-icon="shield_person">shield_person</span>
</div>
<script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loadingIcon');
            const input = document.getElementById('phone');

            if (!input.value) {
                input.classList.add('border-error');
                setTimeout(() => input.classList.remove('border-error'), 1000);
                return;
            }

            // Simple loading state simulation
            btnText.textContent = 'Verifying Credentials...';
            loading.classList.remove('hidden');
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.disabled = true;

            setTimeout(() => {
                btnText.textContent = 'Login to Dashboard';
                loading.classList.add('hidden');
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                btn.disabled = false;
                
                // Show success feedback
                const notification = document.createElement('div');
                notification.className = 'fixed top-8 right-8 bg-success-momo text-white p-4 rounded-lg shadow-xl font-body-md z-50 flex items-center gap-3 animate-bounce';
                notification.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Authorization confirmed. Redirecting...';
                document.body.appendChild(notification);
                
                setTimeout(() => notification.remove(), 2500);
            }, 1800);
        });

        // Form masking logic (Simple placeholder behavior)
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 9) val = val.slice(0, 9);
            
            let formatted = '';
            if (val.length > 0) formatted += val.slice(0, 3);
            if (val.length > 3) formatted += ' ' + val.slice(3, 6);
            if (val.length > 6) formatted += ' ' + val.slice(6, 9);
            
            e.target.value = formatted;
        });
    </script>
</body></html>
