<script>
        // OTP Auto-focus Logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple Countdown Timer Logic
        let timeLeft = 118; // 01:58 in seconds
        const timerElement = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "Ready to resend";
                timerElement.parentElement.nextElementSibling.classList.remove('opacity-50', 'cursor-not-allowed');
                timerElement.parentElement.nextElementSibling.removeAttribute('disabled');
            } else {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerElement.innerText = `Resend Code in ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }
        }, 1000);

        // Interaction Feedback
        document.querySelector('button').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Authenticating...';
            setTimeout(() => {
                window.location.reload(); // Simulate progress
            }, 1500);
        });
    </script>
